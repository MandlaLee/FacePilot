name: Build FaceWeave Windows LIVE EXE

on:
  push:
    branches: [build/faceweave-windows-live]
    paths:
      - "faceweave-windows/**"
      - ".github/workflows/faceweave-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executable:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: faceweave-windows
    steps:
      - name: Check out isolated Windows build branch
        uses: actions/checkout@v4

      - name: Configure Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: faceweave-windows/requirements-build.txt

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Test mathematical invariants and imports
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m faceweave --self-test

      - name: Build standalone Windows EXE (no model weights bundled)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FaceWeave --collect-binaries onnxruntime --collect-data onnxruntime --hidden-import onnxruntime.capi.onnxruntime_pybind11_state --exclude-module tkinter run_faceweave.py
          if (!(Test-Path "dist/FaceWeave.exe")) { throw "Executable was not produced" }

      - name: Verify built executable on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist/FaceWeave.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "FaceWeave.exe packaged self-test failed: $($p.ExitCode)" }
          Write-Host "Windows EXE packaged self-test passed"

      - name: Create portable FaceWeave folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "portable/models" | Out-Null
          Copy-Item "dist/FaceWeave.exe" "portable/FaceWeave.exe"
          Copy-Item "WINDOWS-SETUP.md" "portable/README-WINDOWS.md"
          Copy-Item "models/README.txt" "portable/models/README.txt"
          (Get-FileHash "portable/FaceWeave.exe" -Algorithm SHA256).Hash | Out-File "portable/FaceWeave.exe.sha256"
          Write-Host "EXE bytes: $((Get-Item 'portable/FaceWeave.exe').Length)"
          Get-ChildItem "portable" -Recurse | Select-Object FullName,Length

      - name: Publish Windows EXE as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceWeave-Windows-LIVE-EXE
          path: faceweave-windows/portable/
          retention-days: 30
          if-no-files-found: error
